name: Check site
on: [pull_request, push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      # The published site must match the sources: rebuild and fail if docs/ changes.
      - run: npm run build && git diff --exit-code -- docs
